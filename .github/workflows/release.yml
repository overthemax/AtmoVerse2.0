# Rilascio di AtmoVerse: a ogni tag vX.Y.Z compila il firmware, genera il
# manifest per l'aggiornamento automatico e pubblica la release su GitHub.
# I dispositivi leggono .../releases/latest/download/manifest.json.
#
# Per pubblicare una nuova versione:
#   git tag v2.1.1
#   git push origin v2.1.1

name: Release firmware

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # La cartella deve chiamarsi come il file .ino principale
      - uses: actions/checkout@v4
        with:
          path: AtmoVerse_2.0

      - uses: arduino/setup-arduino-cli@v2

      - name: Installa core ESP32 e librerie
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls "$URL"
          arduino-cli lib install "GxEPD2@1.6.9" "ArduinoJson@7.4.3" "RTClib@2.1.4" \
            "Adafruit INA219@1.2.3" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4"

      - name: Imposta la versione dal tag
        working-directory: AtmoVerse_2.0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Il tag deve essere nel formato vX.Y.Z (trovato: $GITHUB_REF_NAME)"; exit 1
          fi
          sed -i "s/#define ATMOVERSE_VERSION \".*\"/#define ATMOVERSE_VERSION \"$VERSION\"/" Version.h
          grep -q "\"$VERSION\"" Version.h
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # partitions.csv nella cartella dello sketch fornisce le due aree OTA
      - name: Compila
        working-directory: AtmoVerse_2.0
        run: |
          arduino-cli compile -j 0 --fqbn esp32:esp32:lolin32 \
            --build-property upload.maximum_size=1966080 \
            --output-dir build .
          cp build/AtmoVerse_2.0.ino.bin firmware.bin

      - name: Genera il manifest
        working-directory: AtmoVerse_2.0
        run: |
          python3 tools/make_manifest.py --version "$VERSION" --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --firmware firmware.bin --sd sd_files --out manifest.json
          cat manifest.json

      - name: Pubblica la release
        working-directory: AtmoVerse_2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" firmware.bin manifest.json \
            --title "AtmoVerse $VERSION" --generate-notes
