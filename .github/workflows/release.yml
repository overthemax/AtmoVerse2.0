# AtmoVerse release: for every vX.Y.Z tag, builds the firmware, generates the
# manifest for the automatic update and publishes the release on GitHub.
# Devices read .../releases/latest/download/manifest.json.
#
# To publish a new version:
#   git tag v2.1.1
#   git push origin v2.1.1

name: Release firmware

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The folder must have the same name as the main .ino file
      - uses: actions/checkout@v4
        with:
          path: AtmoVerse_2.0

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls "$URL"
          arduino-cli lib install "GxEPD2@1.6.9" "ArduinoJson@7.4.3" "RTClib@2.1.4" \
            "Adafruit INA219@1.2.3" "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4" \
            "U8g2_for_Adafruit_GFX@1.8.0"

      - name: Set the version from the tag
        working-directory: AtmoVerse_2.0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tag must look like vX.Y.Z (found: $GITHUB_REF_NAME)"; exit 1
          fi
          sed -i "s/#define ATMOVERSE_VERSION \".*\"/#define ATMOVERSE_VERSION \"$VERSION\"/" Version.h
          grep -q "\"$VERSION\"" Version.h
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # partitions.csv in the sketch folder provides the two OTA slots
      - name: Build
        working-directory: AtmoVerse_2.0
        run: |
          arduino-cli compile -j 0 --fqbn esp32:esp32:lolin32 \
            --build-property upload.maximum_size=1966080 \
            --output-dir build .
          cp build/AtmoVerse_2.0.ino.bin firmware.bin

      - name: Generate the manifest
        working-directory: AtmoVerse_2.0
        run: |
          python3 tools/make_manifest.py --version "$VERSION" --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --firmware firmware.bin --sd sd_files --out manifest.json
          cat manifest.json

      - name: Publish the release
        working-directory: AtmoVerse_2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" firmware.bin manifest.json \
            --title "AtmoVerse $VERSION" --generate-notes
