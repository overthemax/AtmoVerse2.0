<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Fasi lunari (12 diverse fasi) -->
  
  <!-- Fase 0: Luna nuova -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 1: Luna crescente inizio -->
  <g transform="translate(110, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 1 50 90 A 35 35 0 0 0 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 2: Luna crescente -->
  <g transform="translate(210, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 1 50 90 A 20 35 0 0 0 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 3: Primo quarto -->
  <g transform="translate(310, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 1 50 90 L 50 10 Z" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 4: Gibbosa crescente -->
  <g transform="translate(410, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 1 50 90 L 90 50 A 40 40 0 0 0 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 5: Gibbosa crescente avanzata -->
  <g transform="translate(10, 110)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 10 50 A 40 40 0 0 1 90 50 A 40 40 0 0 1 10 50" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 6: Luna piena -->
  <g transform="translate(110, 110)">
    <circle cx="50" cy="50" r="40" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 7: Gibbosa calante inizio -->
  <g transform="translate(210, 110)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 10 50 A 40 40 0 0 0 90 50 A 40 40 0 0 0 10 50" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 8: Gibbosa calante -->
  <g transform="translate(310, 110)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 0 50 90 L 10 50 A 40 40 0 0 1 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 9: Ultimo quarto -->
  <g transform="translate(410, 110)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 0 50 90 L 50 10 Z" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 10: Luna calante -->
  <g transform="translate(510, 10)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 0 50 90 A 20 35 0 0 1 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Fase 11: Luna calante fine -->
  <g transform="translate(510, 110)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="1"/>
    <path d="M 50 10 A 40 40 0 0 0 50 90 A 35 35 0 0 1 50 10" fill="black" stroke="black" stroke-width="1"/>
  </g>
</svg>
